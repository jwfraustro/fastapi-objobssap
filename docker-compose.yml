version: '3.8'

services:
  fastapi_objobssap_api:
    build: .
    environment:
      - PORT=8000
    command: bash -c 'uvicorn fastapi_objobssap.main:app --host 0.0.0.0 --port ${PORT}'
    volumes:
      - .:/app
    ports:
      - "${PORT:-8000}:8000"
    networks:
      - fastapi_objobssap_network
